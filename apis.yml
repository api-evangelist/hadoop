aid: hadoop
name: Apache Hadoop
description: >-
  Apache Hadoop is an open-source framework for distributed storage and processing of large datasets across clusters of
  computers using simple programming models. It includes HDFS for distributed storage, YARN for resource management, and
  MapReduce for parallel data processing.
