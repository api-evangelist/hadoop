      operations:
      - name: webhdfsget
        method: GET
        description: WebHDFS GET operations
        inputParameters:
        - name: path
          in: path
          type: string
          required: true
        - name: op
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
